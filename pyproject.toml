[project]
name = "deepseek-from-scratch"
version = "0.1.0"
description = "DeepSeek-V3 implementation from scratch with Ray pipeline orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeepSeek Team" }
]
keywords = ["deepseek", "ray", "training", "mlx", "pytorch", "rust", "llm", "transformer", "moe", "mla"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pipeline = [
    "ray[default]>=2.9.0",
    "modal>=0.64.0",
]
torch = [
    "torch>=2.2.0",
    "transformers>=4.35.0",
    "tokenizers>=0.15.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "safetensors>=0.4.0",
    "wandb>=0.16.0",
    "tensorboard>=2.14.0",
]
cuda = [
    "flash-attn>=2.5.0; sys_platform == 'linux'",
    "triton>=2.2.0; sys_platform == 'linux'",
]
mlx = [
    "mlx>=0.10.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
ane = [
    "coremltools>=7.1; sys_platform == 'darwin'",
    "torch>=2.0.0",  # ANE tools rely on torch for conversion
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "memory-profiler>=0.61.0",
]

[project.scripts]
deepseek = "deepseek.pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::torch.jit.TracerWarning",
    "ignore:.*TracerWarning.*:UserWarning",
    "ignore:.*pin_memory.*:UserWarning",
    "ignore:.*zero-element tensors.*:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tests/", "Deepseek-from-scratch-in-rust/"]
