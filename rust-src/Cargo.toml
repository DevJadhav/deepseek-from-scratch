[package]
name = "deepseek_from_scratch_in_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.8.2", features = ["metal", "accelerate"] }
candle-nn = { version = "0.8.2", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.8.2", features = ["metal", "accelerate"] }
anyhow = "1.0"
accelerate-src = "0.3.2"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["full"] }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Checksum
sha2 = "0.10"

# Metrics
prometheus = "0.13"

# Testing
tempfile = "3.10"

# Benchmarking (dev dependency)
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }

[features]
# Default: Metal backend for Apple Silicon (macOS)
# For CUDA systems: cargo build --features cuda
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# Note: Metal support is always enabled via accelerate-src and metal features in candle

# Profile configurations for maximum performance
[profile.release]
lto = true                 # Link Time Optimization for maximum performance
codegen-units = 1          # Single codegen unit for better optimization
opt-level = 3              # Maximum optimization level
panic = "abort"            # Smaller binary, faster unwinding
strip = true               # Strip symbols for smaller binary

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3

# Profile for profiling (with debug symbols)
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "attention_bench"
harness = false

[[bench]]
name = "moe_bench"
harness = false
