[package]
name = "deepseek_from_scratch_in_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "deepseek_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
pyo3-bindings = ["dep:pyo3", "dep:numpy", "dep:ndarray"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# macOS-specific acceleration features
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate", "dep:accelerate-src"]

[dependencies]
# Candle ML framework - base dependencies without platform-specific features
candle-core = { version = "0.8.2" }
candle-nn = { version = "0.8.2" }
candle-transformers = { version = "0.8.2" }
anyhow = "1.0"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["full"] }

# macOS-specific accelerate (optional, only enabled on macOS)
accelerate-src = { version = "0.3.2", optional = true }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Checksum
sha2 = "0.10"

# Metrics
prometheus = "0.13"

# Testing
tempfile = "3.10"

# PyO3 for Python bindings (Zero-Copy Interop) - optional feature
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.22", optional = true }
ndarray = { version = "0.16", optional = true }

# Arrow for efficient tensor serialization
arrow = { version = "53.0", features = ["ipc"] }
arrow-array = "53.0"
arrow-buffer = "53.0"
arrow-ipc = "53.0"
arrow-schema = "53.0"

# Shared memory for Ray actor communication
memmap2 = "0.9"
parking_lot = "0.12"

# Half-precision float types
half = "2.4"

# Random number generation for benchmarks
rand = "0.8"

# System information for resource detection
num_cpus = "1.16"
sys-info = "0.9"
hostname = "0.4"
uuid = { version = "1.10", features = ["v4"] }

# Time handling and lazy statics for profiler
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
lazy_static = "1.5"

# Benchmarking (dev dependency)
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }

# Profile configurations for maximum performance
[profile.release]
lto = true                 # Link Time Optimization for maximum performance
codegen-units = 1          # Single codegen unit for better optimization
opt-level = 3              # Maximum optimization level
panic = "abort"            # Smaller binary, faster unwinding
strip = true               # Strip symbols for smaller binary

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3

# Profile for profiling (with debug symbols)
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "attention_bench"
harness = false

[[bench]]
name = "moe_bench"
harness = false

[[bench]]
name = "zero_copy_bench"
harness = false
required-features = ["pyo3-bindings"]