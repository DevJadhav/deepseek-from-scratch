# DeepSpeed ZeRO Stage 2 Configuration
# Optimized for memory efficiency with CPU offloading

defaults:
  - _self_

name: deepspeed_zero2

# DeepSpeed engine settings
deepspeed:
  enabled: true
  
  # Training batch settings
  train_batch_size: 32  # Global batch size across all GPUs
  train_micro_batch_size_per_gpu: 4  # Per-GPU micro batch
  gradient_accumulation_steps: 8
  
  # ZeRO Stage 2: Optimizer state + gradient partitioning
  zero_optimization:
    stage: 2
    
    # Optimizer state offloading
    offload_optimizer:
      device: cpu
      pin_memory: true
      buffer_count: 4
      fast_init: true
    
    # Gradient partitioning
    contiguous_gradients: true
    overlap_comm: true
    reduce_scatter: true
    reduce_bucket_size: 5e8
    allgather_bucket_size: 5e8
    
    # Memory optimization
    sub_group_size: 1e9
    stage3_prefetch_bucket_size: 0
    stage3_param_persistence_threshold: 0
  
  # Optimizer settings
  optimizer:
    type: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.95]
      eps: 1e-8
      weight_decay: 0.01
  
  # Learning rate scheduler
  scheduler:
    type: WarmupDecayLR
    params:
      warmup_min_lr: 0
      warmup_max_lr: 1e-4
      warmup_num_steps: 500
      total_num_steps: 150000
  
  # Mixed precision
  fp16:
    enabled: false
  
  bf16:
    enabled: true
  
  # Gradient clipping
  gradient_clipping: 1.0
  
  # Activation checkpointing
  activation_checkpointing:
    partition_activations: true
    cpu_checkpointing: false
    contiguous_memory_optimization: false
    number_checkpoints: null
    synchronize_checkpoint_boundary: false
    profile: false
  
  # Communication settings
  communication_data_type: fp16
  prescale_gradients: false
  gradient_predivide_factor: 1.0
  sparse_gradients: false
  
  # Tensor cores
  flops_profiler:
    enabled: false
    profile_step: 1
    module_depth: -1
    top_modules: 1
    detailed: true
  
  # Wall clock breakdown
  wall_clock_breakdown: false

# Training hyperparameters
training:
  max_steps: 150000
  warmup_steps: 500
  save_steps: 5000
  log_steps: 50
  eval_steps: 1000
  max_grad_norm: 1.0
  
  # Learning rate
  learning_rate: 1e-4
  min_learning_rate: 1e-6
  lr_scheduler_type: cosine
  
  # Regularization
  weight_decay: 0.01
  dropout: 0.0

# Distributed settings
distributed:
  data_parallel_size: auto
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  expert_parallel_size: 1
  sequence_parallel_size: 1
  zero_stage: 2
