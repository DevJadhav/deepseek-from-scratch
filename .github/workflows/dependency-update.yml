# Dependency Update Workflow
# Automatically checks for dependency updates and creates PRs
#
# Runs weekly to keep dependencies fresh

name: Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ==========================================================================
  # Python Dependency Updates (uv)
  # ==========================================================================
  python-deps:
    name: Python Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check for updates
        id: check
        run: |
          # Get current state
          cp uv.lock uv.lock.old

          # Update dependencies
          uv lock --upgrade

          # Check if there are changes
          if ! diff -q uv.lock uv.lock.old > /dev/null 2>&1; then
            echo "updates=true" >> $GITHUB_OUTPUT
            echo "Updates found!"
          else
            echo "updates=false" >> $GITHUB_OUTPUT
            echo "No updates needed"
          fi

      - name: Run tests with updated deps
        if: steps.check.outputs.updates == 'true'
        run: |
          uv sync --extra dev
          uv run pytest deepseek-from-scratch-python/tests \
            -m "not gpu and not distributed and not slow" \
            --ignore=deepseek-from-scratch-python/tests/training/test_distributed.py \
            -x -q

      - name: Create Pull Request
        if: steps.check.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Python dependencies"
          title: "chore(deps): Update Python dependencies"
          body: |
            ## Automated Dependency Update

            This PR updates Python dependencies to their latest compatible versions.

            ### Changes
            - Updated `uv.lock` with latest package versions

            ### Testing
            - ✅ All CPU tests pass with updated dependencies

            ---
            *This PR was automatically generated by the dependency update workflow.*
          branch: deps/python-updates
          delete-branch: true
          labels: |
            dependencies
            python
            automated

  # ==========================================================================
  # Rust Dependency Updates (Cargo)
  # ==========================================================================
  rust-deps:
    name: Rust Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Deepseek-from-scratch-in-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check for updates
        id: check
        working-directory: Deepseek-from-scratch-in-rust
        run: |
          # Get current state
          cp Cargo.lock Cargo.lock.old 2>/dev/null || true

          # Update dependencies
          cargo update

          # Check if there are changes
          if [ -f Cargo.lock.old ]; then
            if ! diff -q Cargo.lock Cargo.lock.old > /dev/null 2>&1; then
              echo "updates=true" >> $GITHUB_OUTPUT
              echo "Updates found!"
            else
              echo "updates=false" >> $GITHUB_OUTPUT
              echo "No updates needed"
            fi
          else
            echo "updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Run security audit
        if: steps.check.outputs.updates == 'true'
        working-directory: Deepseek-from-scratch-in-rust
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Run tests with updated deps
        if: steps.check.outputs.updates == 'true'
        working-directory: Deepseek-from-scratch-in-rust
        run: |
          cargo test --all-features

      - name: Create Pull Request
        if: steps.check.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Rust dependencies"
          title: "chore(deps): Update Rust dependencies"
          body: |
            ## Automated Dependency Update

            This PR updates Rust dependencies to their latest compatible versions.

            ### Changes
            - Updated `Cargo.lock` with latest crate versions

            ### Security
            - ✅ `cargo audit` passed

            ### Testing
            - ✅ All Rust tests pass

            ---
            *This PR was automatically generated by the dependency update workflow.*
          branch: deps/rust-updates
          delete-branch: true
          labels: |
            dependencies
            rust
            automated

  # ==========================================================================
  # Pre-commit Hook Updates
  # ==========================================================================
  precommit-deps:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Update hooks
        id: update
        run: |
          # Autoupdate pre-commit hooks
          pre-commit autoupdate

          # Check if there are changes
          if git diff --quiet .pre-commit-config.yaml; then
            echo "updates=false" >> $GITHUB_OUTPUT
          else
            echo "updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update pre-commit hooks"
          title: "chore(deps): Update pre-commit hooks"
          body: |
            ## Automated Pre-commit Update

            This PR updates pre-commit hooks to their latest versions.

            ---
            *This PR was automatically generated by the dependency update workflow.*
          branch: deps/precommit-updates
          delete-branch: true
          labels: |
            dependencies
            tooling
            automated
