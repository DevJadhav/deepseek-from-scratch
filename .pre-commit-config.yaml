# Pre-commit hooks for DeepSeek From Scratch
# Install with: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # General formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags for Hydra
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: check-docstring-first

  # Python formatting and linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Python type checking with Pyright
  - repo: https://github.com/RobertCraiworthy/pyright-python
    rev: v1.1.350
    hooks:
      - id: pyright
        args: [--project, pyproject.toml]
        additional_dependencies:
          - torch>=2.2.0
          - hydra-core>=1.3.0
          - omegaconf>=2.3.0
          - wandb>=0.16.0

  # Rust formatting and linting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path Deepseek-from-scratch-in-rust/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path Deepseek-from-scratch-in-rust/Cargo.toml -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        exclude: ^(configs/hydra/)

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        args: [--skip, "*.json,*.lock,*.safetensors,./Deepseek-from-scratch-in-rust/target/*"]
        exclude: ^(Deepseek-from-scratch-in-rust/target/)

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from hooks
  autoupdate_commit_msg: |
    [pre-commit.ci] pre-commit autoupdate
  autoupdate_schedule: weekly

default_language_version:
  python: python3.10
